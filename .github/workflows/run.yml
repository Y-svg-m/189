name: Cloud check in action

on:
  push:
    branches:
      - main
  watch:
    types: started
  workflow_dispatch:
  schedule:
    - cron: '35 2 * * *'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # 必须指定 environment，Actions 才能读取到该环境下的 Environment secrets
    environment: user
    steps:
      - name: 🔌 Check out code
        uses: actions/checkout@v4

      - name: 🔨 Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: 👾 Check if Debug is true
        if: vars.debug == '1'
        run: |
          echo "CLOUD189_VERBOSE=1" >> $GITHUB_ENV

      - name: 📹 Restore cached Cookie
        id: cache-cookie-restore
        uses: actions/cache/restore@v4
        with:
          path: .token
          key: cloud189-token-${{ hashFiles('.token/*.json') }}
          restore-keys: cloud189-token-

      - name: 🔧 Generate .env File
        # 用原生 Shell 直接把 TY_ACCOUNTS 写入 .env 文件，不再触发 GitHub 拦截警告
        run: |
          cat << 'EOF' > .env
          TY_ACCOUNTS=${{ secrets.TY_ACCOUNTS }}
          EOF

      - name: 📡 Init dependencies
        run: npm install

      - name: 🚀 Run
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          command: npm start

      - name: 🔑 Compute token hash
        if: always()
        run: |
          if [ -d ".token" ]; then
            NEW_HASH=$(find .token -name '*.json' -exec sha256sum {} \; 2>/dev/null | sha256sum | cut -d' ' -f1)
            echo "TOKEN_HASH=${NEW_HASH}" >> $GITHUB_ENV
          fi

      - name: 📹 Save cached Cookie
        if: always() && env.TOKEN_HASH != ''
        uses: actions/cache/save@v4
        with:
          path: .token
          key: cloud189-token-${{ env.TOKEN_HASH }}
